<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ЯКласс Помощник</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>ЯКласс Помощник</h1>
    <span class="version">v0.1.0</span>
  </header>

  <section class="config">
    <label for="apiKey">Gemini API ключ</label>
    <div class="row">
      <input type="password" id="apiKey" placeholder="AIza...">
      <button id="toggleKeyVisibility" class="icon-btn" title="Показать/скрыть">👁</button>
    </div>
    <a href="https://aistudio.google.com/apikey" target="_blank" class="hint">
      Получить ключ →
    </a>

    <label for="model">Модель</label>
    <select id="model">
      <option value="gemini-3-flash">gemini-3-flash (рекомендуется)</option>
      <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (быстрее, проще задачи)</option>
      <option value="gemini-3-pro">gemini-3-pro (умнее, лимиты строже)</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash (запасной)</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro (запасной)</option>
    </select>

    <label for="speed">Скорость (имитация человека)</label>
    <select id="speed">
      <option value="slow">Медленно (безопасно)</option>
      <option value="normal" selected>Обычно</option>
      <option value="fast">Быстро (рискованно)</option>
    </select>

    <label class="checkbox">
      <input type="checkbox" id="autoNext" checked>
      Автоматически переходить к следующему заданию
    </label>

    <button id="saveBtn" class="secondary">Сохранить настройки</button>
  </section>

  <section class="controls">
    <button id="startBtn" class="primary">▶ Запустить</button>
    <button id="stopBtn" class="danger" disabled>■ Остановить</button>
  </section>

  <section class="status">
    <div class="status-row">
      <span>Статус:</span>
      <strong id="statusText">остановлен</strong>
    </div>
    <div class="status-row">
      <span>Решено:</span>
      <strong id="solvedCount">0</strong>
    </div>
    <div class="status-row">
      <span>Ошибок:</span>
      <strong id="errorCount">0</strong>
    </div>
  </section>

  <section class="log">
    <h3>Лог</h3>
    <div id="logBox"></div>
  </section>

  <footer>
    <small>
      Открой задание на yaklass.ru и нажми «Запустить».
      Расширение само пройдёт теорию и попробует решить задачи.
    </small>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
